<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sugarlump sweet neighbor</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; background-color: #ffff99; 
            font-family: sans-serif; display: flex; justify-content: center; 
        }
        .container { 
            width: 100%; max-width: 500px; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .header-logo { width: 100%; max-width: 350px; margin-bottom: 20px; }
        
        /* UI Buttons */
        .ui-group { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; z-index: 10; }
        .main-button {
            background: #fff; border: 3px solid #59cbe8; border-radius: 15px;
            width: 280px; height: 65px; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; font-size: 22px; font-weight: bold; color: #000099;
        }
        .main-button img { height: 40px; margin-right: 12px; }

        /* AR Modal/Overlay */
        #ar-tip-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;
        }
        .tip-content {
            background: white; width: 85%; max-width: 320px; padding: 25px; 
            border-radius: 20px; border: 4px solid #59cbe8; text-align: center;
        }
        .tip-btn {
            background: #ff69b4; color: white; border: none; padding: 15px 30px; 
            border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        /* Certificate Modal */
        #cert-modal {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center;
        }
        #cert-iframe { width: 90%; height: 75%; border-radius: 10px; background: white; }
        
        /* Hidden Viewer */
        model-viewer#reveal { display: none; width: 1px; height: 1px; }

        .links-group { margin-top: 20px; line-height: 2; color: #ff69b4; font-weight: bold; }
        .links-group a { color: #59cbe8; text-decoration: none; }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/erin_video_scenes-32.png" class="header-logo">
        
        <model-viewer id="reveal" 
            src="Models/entire_family_99cm.glb" 
            ios-src="Models/GIRL_converted.usdz#allowsScaling=1"
            ar ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor" ar-scale="auto">
        </model-viewer>

        <div class="ui-group">
            <div id="ar-launch" class="main-button">
                <img src="images/Heart button.png">
                <span>push here</span>
            </div>
            <div id="btn-cert" class="main-button">
                <img src="images/sl_ribbon2.png">
                <span>print certificate</span>
            </div>
        </div>

        <div class="links-group">
            <div>about: <a href="https://sugarlump.love/about" target="_blank">creativity + kindness</a></div>
            <div>shop: <a href="https://sugarlump.love/shop" target="_blank">kindness kits</a></div>
        </div>

        <div id="ar-tip-overlay">
            <div class="tip-content">
                <h2 style="color: #ff69b4; margin-top: 0;">Camera Tips</h2>
                <p style="color: #000099; text-align: left; font-size: 16px;">
                    1. <b>Tap screen once</b> to see the 📸 Record circle.<br><br>
                    2. <b>Pinch your fingers</b> on the family to zoom!
                </p>
                <button id="launch-trigger" class="tip-btn">GOT IT! START</button>
            </div>
        </div>

        <div id="cert-modal">
            <iframe id="cert-iframe"></iframe>
            <button class="tip-btn" onclick="document.getElementById('cert-modal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <audio id="ar-audio" src="Sound/sweet_neighbor_of_mine3.mp3" preload="auto"></audio>

    <script>
        const mv = document.getElementById('reveal');
        const arAudio = document.getElementById('ar-audio');
        const tipOverlay = document.getElementById('ar-tip-overlay');
        const launchTrigger = document.getElementById('launch-trigger');
        const certBtn = document.getElementById('btn-cert');
        const arBtn = document.getElementById('ar-launch');

        // 1. CLICK "PUSH HERE"
        arBtn.addEventListener('click', () => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const isIPad = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isMobile || isIPad) {
                tipOverlay.style.display = 'flex';
                // Unlock audio for later
                arAudio.play().then(() => { arAudio.pause(); }).catch(e => {});
            } else {
                alert("Please open this on your phone or iPad!");
            }
        });

        // 2. CLICK "GOT IT! START"
        launchTrigger.addEventListener('click', () => {
            tipOverlay.style.display = 'none';
            mv.style.display = 'block';
            mv.activateAR();
        });

        // AR Events
        mv.addEventListener('ar-status', (e) => {
            if (e.detail.status === 'object-placed') {
                arAudio.currentTime = 0; arAudio.play();
            } else if (e.detail.status === 'not-presenting') {
                mv.style.display = 'none';
                arAudio.pause();
            }
        });

        // 3. CERTIFICATE LOGIC
        certBtn.addEventListener('click', async () => {
            if (typeof PDFLib === 'undefined') return;
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            try {
                const res = await fetch('certificates/sugarlump_app_certificate.pdf');
                const existingPdfBytes = await res.arrayBuffer();
                const pdfDoc = await PDFDocument.load(existingPdfBytes);
                const page = pdfDoc.getPages()[0];
                
                const today = new Date();
                const dateStr = today.toLocaleDateString();
                const helvBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                
                // Stamp Data
                page.drawText("Tercek Real Estate Group", { x: 95, y: 365, size: 18, font: helvBold, color: rgb(0.03, 0.46, 0.56) });
                page.drawText(`Date: ${dateStr}`, { x: 95, y: 303, size: 10, font: helvBold });

                const pdfBytes = await pdfDoc.save();
                const blobUrl = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
                
                document.getElementById('cert-iframe').src = blobUrl;
                document.getElementById('cert-modal').style.display = 'flex';
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = "Sugarlump_Certificate.pdf";
                link.click();
            } catch (err) { alert("PDF Error: " + err.message); }
        });
    </script>
</body>
</html>
