<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sugarlump sweet neighbor</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #ffff99; 
            font-family: 'Chalet LondonNineteenEighty Regular', sans-serif;
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 600px; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; box-sizing: border-box; text-align: center;
        }

        /* UI Elements */
        .header-logo { width: 100%; max-width: 400px; height: auto; margin-bottom: 20px; }
        .main-button { 
            background: #fff; border: 2px solid #59cbe8; border-radius: 12px;
            width: 280px; height: 60px; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .main-button img { height: 40px; margin-right: 10px; }
        .main-button span { color: #000099; font-weight: bold; font-size: 26px; }

        /* AR Hidden */
        model-viewer#reveal { display: none; width: 1px; height: 1px; position: absolute; }

        /* Video */
        .video-container { position: relative; width: 100%; max-width: 500px; margin-top: 30px; border-radius: 15px; overflow: hidden; border: 3px solid #fff; }
        video { width: 100%; display: block; }
        .play-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 60px; height: 60px; cursor: pointer;
            font-size: 24px; color: #59cbe8; display: flex; align-items: center; justify-content: center;
        }

        /* PDF Preview Modal */
        #cert-modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); flex-direction: column; align-items: center; justify-content: center;
        }
        #cert-iframe { width: 90%; height: 80%; border: none; background: #fff; border-radius: 10px; }
        .close-modal { margin-top: 15px; background: #ff69b4; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .links-group { margin: 20px 0; color: #ff69b4; font-weight: bold; font-size: 18px; line-height: 2; }
        .links-group a { color: #59cbe8; text-decoration: none; }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/erin_video_scenes-32.png" class="header-logo">
        
        <model-viewer id="reveal" src="Models/entire_family_99cm.glb" ios-src="Models/GIRL_converted.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor"></model-viewer>

        <div class="ui-group">
            <button id="ar-launch" class="main-button"><img src="images/Heart button.png"><span>push here</span></button>
            <button id="btn-cert" class="main-button"><img src="images/sl_ribbon2.png"><span style="font-size:20px;">print certificate</span></button>
        </div>

        <div class="links-group">
            <div>about: <a href="https://sugarlump.love/about">creativity + kindness</a></div>
            <div>rewards: <a href="https://sugarlump.love/">the kindness project</a></div>
            <div>join: <a href="https://sugarlump.love/contact">sugarlump kindness club</a></div>
            <div>shop: <a href="https://sugarlump.love/shop">creative kindness kits</a></div>
            <div>sponsors: <a href="https://sugarlump.love/sponsors">get involved</a></div>
        </div>

        <div class="video-container">
            <video id="intro-video" poster="images/Video Poster_2.png" playsinline muted>
                <source src="Video/sugarlump_intro_erin_2.mp4" type="video/mp4">
            </video>
            <button id="play-btn" class="play-btn">▶</button>
        </div>
    </div>

    <div id="cert-modal">
        <iframe id="cert-iframe"></iframe>
        <button class="close-modal" onclick="document.getElementById('cert-modal').style.display='none'">Close Preview</button>
    </div>

    <audio id="ar-audio" src="Sound/sweet_neighbor_of_mine3.mp3"></audio>

    <script>
        const mv = document.getElementById('reveal');
        const arAudio = document.getElementById('ar-audio');
        const video = document.getElementById('intro-video');
        const playBtn = document.getElementById('play-btn');

        // AR Logic
        document.getElementById('ar-launch').addEventListener('click', () => {
            video.pause();
            if (mv.canActivateAR) {
                mv.style.display = 'block';
                arAudio.play().then(() => arAudio.pause());
                mv.activateAR();
            }
        });

        mv.addEventListener('ar-status', (e) => {
            if (e.detail.status === 'object-placed') arAudio.play();
            else if (e.detail.status === 'not-presenting') mv.style.display = 'none';
        });

        // Video Logic
        playBtn.addEventListener('click', () => {
            video.play(); video.muted = false; playBtn.style.display = 'none';
        });

        // --- UPDATED ALIGNED CERTIFICATE LOGIC ---
        async function generateCertificate() {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const url = 'certificates/sugarlump_app_certificate.pdf';
            
            try {
                const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
                const pdfDoc = await PDFDocument.load(existingPdfBytes);
                const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                const fontReg = await pdfDoc.embedFont(StandardFonts.Helvetica);
                const firstPage = pdfDoc.getPages()[0];
                const { width, height } = firstPage.getSize();

                const dateStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const expDate = new Date(); expDate.setDate(expDate.getDate() + 30);
                const expStr = expDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                const certId = "260" + Math.floor(Math.random() * 10000000);

                // ALIGNMENT: Mirrored to the "Instructions" block on the right
                const leftMirrorX = 85; 
                const yAnchor = height - 335; 

                // Sponsor Name
                firstPage.drawText('Tercek Real Estate Group', { x: leftMirrorX, y: yAnchor, size: 13, font: fontBold, color: rgb(0.12, 0.44, 0.53) });
                // I Love Me
                firstPage.drawText('I Love Me', { x: leftMirrorX, y: yAnchor - 18, size: 13, font: fontBold, color: rgb(0.95, 0.25, 0.55) });
                // IDs and Dates
                firstPage.drawText(`Certificate No: ${certId}`, { x: leftMirrorX, y: yAnchor - 40, size: 9, font: fontReg, color: rgb(0.12, 0.44, 0.53) });
                firstPage.drawText(`Download Date: ${dateStr}`, { x: leftMirrorX, y: yAnchor - 52, size: 9, font: fontReg, color: rgb(0.12, 0.44, 0.53) });
                // Valid Until in Red
                firstPage.drawText(`Valid until: ${expStr}`, { x: leftMirrorX, y: yAnchor - 65, size: 10, font: fontBold, color: rgb(0.8, 0.1, 0.1) });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                // 1. Show on Screen
                document.getElementById('cert-iframe').src = blobUrl;
                document.getElementById('cert-modal').style.display = 'flex';

                // 2. Auto Download
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `Sugarlump_Kindness_${certId}.pdf`;
                link.click();
            } catch (err) { console.error(err); }
        }

        document.getElementById('btn-cert').addEventListener('click', generateCertificate);
    </script>
</body>
</html>
