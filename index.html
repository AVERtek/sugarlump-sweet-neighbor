<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sugarlump sweet neighbor</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=0-0000000000"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '0-0000000000');
    </script>

    <style>
        html, body { margin: 0; padding: 0; overflow-x: hidden; font-family: Google Sans, Noto, Roboto, sans-serif; color: #244376; background-color: #ffff99; }
        .container { max-width: 600px; width: 100%; box-sizing: border-box; padding: 0 10px; margin: 0 auto; }
        
        .card { break-inside: avoid; background-color: #ffff99; border: 2px solid #ffff99; padding: 10px; margin-bottom: 1em; display: flex; flex-direction: column; align-items: center; text-align: center; border-radius: 6px; overflow: hidden; }
        
        /* INVISIBLE MODEL VIEWER ENGINE */
        #reveal { width: 1px; height: 1px; position: absolute; left: -10000px; }
        
        .main-button { 
            background-color: #ffffff; border-radius: 8px; border: 2px solid #59cbe8; 
            height: 60px; min-width: 250px; display: flex; align-items: center; 
            justify-content: center; padding: 10px; cursor: pointer; transition: 0.3s;
        }
        .main-button:hover { background-color: #f0f8ff; }
        
        @font-face { font-family: 'Chalet LondonNineteenEighty Regular'; src: url('fonts/Chalet LondonNineteenEighty Regular.otf') format('opentype'); }
        @font-face { font-family: 'DaisyByhapppyal-Regular'; src: url('fonts/DaisyByhapppyal-Regular.otf') format('opentype'); }
        
        a { color: #59cbe8; text-decoration: none; }
        video { width: 100%; border-radius: 8px; }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="images/erin_video_scenes-32.png" alt="Logo" style="width: 350px; height: auto; margin: auto;">
        </div>

        <model-viewer id="reveal" 
            src="Models/entire_family_99cm.glb" 
            ios-src="Models/GIRL_converted.usdz"
            ar ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor" 
            loading="eager">
        </model-viewer>

        <div style="text-align: center; margin: 20px 0;">
            <p style="font-family: 'Chalet LondonNineteenEighty Regular'; font-weight: bold; color: #000099;">Make Sure Wi-Fi and Sound is On!</p>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <button id="ar-launch-trigger" class="main-button">
                <img src="images/Heart button.png" style="height: 4em; margin-right: 5px;" alt="AR">
                <span style="font-size: 32px; color: #000099; font-family: 'Chalet LondonNineteenEighty Regular';"><strong>push here</strong></span>
            </button>

            <button id="viewPrintCertificateButton" class="main-button">
                <img src="images/sl_ribbon2.png" style="height: 4em; margin-right: 5px; opacity: 0.8;" alt="Cert">
                <span style="font-size: 20px; color: #000099; font-family: 'Chalet LondonNineteenEighty Regular';"><strong>print certificate</strong></span>
            </button>
        </div>

        <audio id="sound">
            <source id="audio-source" src="Sound/sweet_neighbor_of_mine3.mp3" type="audio/mpeg">
        </audio>

        <div class="card" style="margin-top:20px;">
            <img src="images/erin_video_scenes-34.png" style="width: 300px;">
            <p style="font-family: 'Chalet LondonNineteenEighty Regular'; font-weight: bold; color: #ff69b4;"><b>about:</b><a href="https://sugarlump.love/about"> creativity + kindness</a></p>
            <p style="font-family: 'Chalet LondonNineteenEighty Regular'; font-weight: bold; color: #ff69b4;"><b>rewards:</b><a href="https://sugarlump.love/"> the kindness project</a></p>
            <p style="font-family: 'Chalet LondonNineteenEighty Regular'; font-weight: bold; color: #ff69b4;"><b>join:</b><a href="https://sugarlump.love/contact"> sugarlump kindness club</a></p>
        </div>

        <div style="position: relative; margin: 20px 0;">
            <video id="video-overlay" poster="images/Video Poster_2.png" playsinline muted>
                <source src="Video/sugarlump_intro_erin_2.mp4" type="video/mp4">
            </video>
            <button id="play-pause-button" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.8); border-radius: 50%; padding: 15px; border:none; cursor:pointer;">▶</button>
        </div>

        <div class="card">
            <h2 style="font-family: 'Chalet LondonNineteenEighty Regular'; color: #000099;">Experience 4D Augmented Reality On Your Phone</h2>
            <img src="images/erin_video_scenes-41.png" style="max-width: 100%;">
            <p style="font-size: 12px; color: #000099;"><em>If AR button does not appear, use another browser.</em></p>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <script>
        const modelViewer = document.getElementById('reveal');
        const arTrigger = document.getElementById('ar-launch-trigger');
        const audio = document.getElementById('sound');
        const audioSource = document.getElementById('audio-source');
        const video = document.getElementById('video-overlay');
        const playBtn = document.getElementById('play-pause-button');

        // Audio Assets
        const webAudio = "Sound/sweet_neighbor_of_mine3.mp3";
        const arAudio = "Sound/sweet_neighbor_of_mine3.mp3"; // Swap if you have a shorter AR version

        // --- AR HANDSHAKE LOGIC ---
        arTrigger.addEventListener('click', () => {
            // 1. Stop other media
            video.pause();
            
            // 2. Prepare audio handshake
            audio.pause();
            audioSource.src = arAudio;
            audio.load();
            
            // Prime for iOS
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(e => console.log("Priming audio"));

            // 3. Launch AR
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                alert("AR is not supported on this browser.");
            }
        });

        // --- AR STATUS SYNC ---
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                audio.play();
            }
            if (event.detail.status === 'not-presenting') {
                audio.pause();
                // Reset to web audio
                audioSource.src = webAudio;
                audio.load();
            }
        });

        // --- VIDEO PLAYER LOGIC ---
        function toggleVideo() {
            if (video.paused) {
                video.play();
                video.muted = false;
                playBtn.style.display = "none";
                audio.pause();
            } else {
                video.pause();
                playBtn.style.display = "block";
            }
        }
        video.addEventListener('click', toggleVideo);
        playBtn.addEventListener('click', toggleVideo);

        // --- PDF LOGIC (Placeholder for your existing PDF function) ---
        document.getElementById('viewPrintCertificateButton').addEventListener('click', async () => {
            // Insert your existing generateStampedCertificate() logic here
            alert("Generating Certificate...");
        });
    </script>
</body>
</html>
