<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>sugarlump sweet neighbor</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #ffff99; 
            font-family: 'Chalet LondonNineteenEighty Regular', sans-serif;
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 600px; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; box-sizing: border-box; text-align: center;
        }

        .header-logo { width: 100%; max-width: 400px; height: auto; margin-bottom: 20px; }
        
        .main-button {
            background: #fff; border: 2px solid #59cbe8; border-radius: 12px;
            width: 280px; height: 60px; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .main-button img { height: 40px; margin-right: 10px; }
        .main-button span { color: #000099; font-weight: bold; font-size: 26px; }

        model-viewer#reveal { display: none; width: 1px; height: 1px; position: absolute; }

        /* TIP OVERLAY STYLING */
        #ar-tip-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; border: 4px solid #59cbe8; padding: 25px; border-radius: 20px;
            z-index: 5000; box-shadow: 0 15px 40px rgba(0,0,0,0.4); width: 85%; max-width: 340px;
            text-align: center;
        }
        .tip-btn {
            background: #59cbe8; color: white; border: none; padding: 15px 40px; 
            border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 15px;
        }

        .links-group { margin: 20px 0; line-height: 2; color: #ff69b4; font-weight: bold; font-size: 18px; }
        .links-group a { color: #59cbe8; text-decoration: none; font-size: 18px; }
        
        #cert-modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: center;
        }
        #cert-iframe { width: 90%; height: 80%; border: none; background: #fff; border-radius: 10px; }
        .close-modal { margin-top: 15px; background: #ff69b4; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }

        .video-container { position: relative; width: 100%; max-width: 500px; margin-top: 30px; border-radius: 15px; overflow: hidden; border: 3px solid #fff; }
        video { width: 100%; display: block; cursor: pointer; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; color: #59cbe8; font-size: 24px; cursor: pointer; }

        @font-face { font-family: 'Chalet LondonNineteenEighty Regular'; src: url('fonts/Chalet LondonNineteenEighty Regular.otf'); }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/erin_video_scenes-32.png" class="header-logo">
        <p style="color: #000099; font-size: 18px;"><b>Wi-Fi and Sound On!</b></p>

        <model-viewer id="reveal" 
            src="Models/entire_family_99cm.glb" 
            ios-src="Models/GIRL_converted.usdz#allowsScaling=1"
            ar ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor" 
            ar-scale="auto"
            loading="eager" autoplay>
        </model-viewer>

        <div id="ar-tip-overlay">
            <h2 style="color: #ff69b4; margin-top: 0;">How to Record</h2>
            <p style="color: #000099; font-size: 18px; line-height: 1.4; text-align: left;">
                • <b>Tap your screen once</b> to see the 📸 camera button!<br><br>
                • <b>Pinch the screen</b> to zoom or resize the family!
            </p>
            <button class="tip-btn" id="launch-trigger">GOT IT! START</button>
        </div>

        <div class="ui-group">
            <button id="ar-launch" class="main-button">
                <img src="images/Heart button.png" style="height:40px; margin-right:10px;">
                <span>push here</span>
            </button>
            <button id="btn-cert" class="main-button">
                <img src="images/sl_ribbon2.png" style="height:40px; margin-right:10px;">
                <span style="font-size: 20px;">print certificate</span>
            </button>
        </div>

        <div class="links-group">
            <div>about: <a href="https://sugarlump.love/about" target="_blank">creativity + kindness</a></div>
            <div>shop: <a href="https://sugarlump.love/shop" target="_blank">kindness kits</a></div>
        </div>

        <div class="video-container">
            <video id="intro-video" poster="images/Video Poster_2.png" playsinline muted>
                <source src="Video/sugarlump_intro_erin_2.mp4" type="video/mp4">
            </video>
            <button id="play-btn-overlay" class="play-btn">▶</button>
        </div>
    </div>

    <div id="cert-modal">
        <iframe id="cert-iframe"></iframe>
        <button class="close-modal" onclick="document.getElementById('cert-modal').style.display='none'">Close</button>
    </div>

    <audio id="ar-audio" src="Sound/sweet_neighbor_of_mine3.mp3" preload="auto"></audio>

    <script>
        const mv = document.getElementById('reveal');
        const arAudio = document.getElementById('ar-audio');
        const video = document.getElementById('intro-video');
        const playBtn = document.getElementById('play-btn-overlay');
        const tipOverlay = document.getElementById('ar-tip-overlay');

        // --- IPAD & MOBILE DETECTION FIX ---
        document.getElementById('ar-launch').addEventListener('click', () => {
            video.pause();
            playBtn.style.display = 'flex';

            // Check for standard mobile OR iPad "Desktop Mode" (MacIntel with Touch)
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const isIPadPCMode = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isMobile || isIPadPCMode) {
                tipOverlay.style.display = 'block';
                arAudio.play().then(() => { arAudio.pause(); }).catch(e => {});
            } else {
                alert("Please open this on an iPhone, iPad, or Android device to see the magic!");
            }
        });

        // --- ACTUAL AR LAUNCH ---
        document.getElementById('launch-trigger').addEventListener('click', () => {
            tipOverlay.style.display = 'none';
            mv.style.display = 'block';
            mv.activateAR();
        });

        mv.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                arAudio.currentTime = 0; arAudio.play();
            } else if (event.detail.status === 'not-presenting') {
                arAudio.pause(); mv.style.display = 'none';
            }
        });

        // Video control
        function toggleVideo() {
            if (video.paused) { video.play(); video.muted = false; playBtn.style.display = 'none'; }
            else { video.pause(); playBtn.style.display = 'flex'; }
        }
        playBtn.addEventListener('click', toggleVideo);
        video.addEventListener('click', toggleVideo);

        // --- FULL PDF LOGIC RESTORED ---
