<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sugarlump sweet neighbor</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: Google Sans, Noto, Roboto, Helvetica Neue, sans-serif;
            color: #244376;
        }

        .container {
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .card {
            background-color: rgb(255, 255, 153);
            border: 2px solid rgb(255, 255, 153);
            padding: 10px;
            margin: 0 0 1em 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-radius: 6px;
            overflow: hidden;
        }

        .main-button {
            background-color: #ffffff;
            border-radius: 8px;
            border: 2px solid #59cbe8;
            height: 60px;
            min-width: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .main-button-text {
            font-size: 32px;
            color: #000099;
            font-family: 'Chalet LondonNineteenEighty Regular', sans-serif;
            white-space: nowrap;
        }

        video {
            object-fit: cover;
            cursor: pointer;
        }

        #play-pause-button {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .main-button { width: 100%; max-width: 250px; height: 50px; }
            .main-button img { height: 3em !important; }
            .main-button span { font-size: 24px !important; }
        }
    </style>
</head>

<body bgcolor="#ffff99" style="display: flex; flex-direction: column; align-items: center;">

    <div class="container">
        <div class="card">
            <img src="images/erin_video_scenes-32.png" alt="Logo" style="width: 350px; height: auto;">
        </div>

        <div class="card" style="position: relative; height: 200px;">
            <model-viewer id="reveal" src="Models/entire_family_99cm.glb" 
                ar ar-modes="scene-viewer webxr quick-look" camera-controls 
                poster="images/Video Poster_2.png" style="width: 100%; height: 200px;">
            </model-viewer>
        </div>

        <div style="text-align: center; font-weight: bold; color: #000099; margin-top: 10px;">
            Make Sure Wi-Fi and Sound is On!
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
            <button id="ar-button" class="main-button">
                <img src="images/Heart button.png" style="height: 4em; margin-right: 5px;">
                <span class="main-button-text"><strong>push here</strong></span>
            </button>

            <button id="viewPrintCertificateButton" class="main-button">
                <img src="images/sl_ribbon2.png" style="height: 4em; margin-right: 5px;">
                <span style="font-size: 20px; color: #000099; font-family: sans-serif;"><strong>print certificate</strong></span>
            </button>
        </div>

        <div class="card">
            <img src="images/erin_video_scenes-34.png" style="width: 300px; height: auto">
            <p style="color: #ff69b4;"><b>about:</b> <a href="#" style="color:#59cbe8;">creativity + kindness</a></p>
            <p style="color: #ff69b4;"><b>rewards:</b> <a href="#" style="color:#59cbe8;">the kindness project</a></p>
            <h1 style="color: #000099; font-style: italic; margin-top: 20px;">THIS KINDNESS PROJECT SPONSORED BY</h1>
            <img src="images/erin_video_scenes-37.png" style="width: 300px; height: auto">
        </div>

        <div style="position: relative; width: 100%; margin-top: 20px;">
            <video id="video-overlay" style="width: 100%; display: block;" poster="images/Video Poster_2.png" playsinline>
                <source src="Video/sugarlump_intro_erin_2.mp4" type="video/mp4">
            </video>
            <button id="play-pause-button">▶</button>
        </div>
    </div>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const video = document.getElementById('video-overlay');
            const playPauseButton = document.getElementById('play-pause-button');
            const certBtn = document.getElementById('viewPrintCertificateButton');

            // --- FIXED VIDEO LOGIC ---
            function toggleVideo() {
                if (video.paused || video.ended) {
                    video.play();
                    playPauseButton.innerHTML = "❚❚";
                    // Briefly show pause icon then fade out
                    setTimeout(() => { if(!video.paused) playPauseButton.style.opacity = "0"; }, 1000);
                } else {
                    video.pause();
                    playPauseButton.innerHTML = "▶";
                    playPauseButton.style.opacity = "1";
                }
            }

            video.addEventListener('click', toggleVideo);
            playPauseButton.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleVideo();
            });

            // Ensure button is visible when video is paused
            video.addEventListener('pause', () => {
                playPauseButton.innerHTML = "▶";
                playPauseButton.style.opacity = "1";
            });

            // --- CERTIFICATE NUMBER GENERATION (YYMMDDHHmm) ---
            async function generateCertificate() {
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const now = new Date();
                
                const pad = (n) => String(n).padStart(2, '0');
                const certNo = `${String(now.getFullYear()).slice(-2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}`;
                
                // Existing PDF Logic...
                console.log("Generating Certificate No:", certNo);
                alert("Generating Certificate #" + certNo);
                // The rest of your PDFLib drawing logic goes here using 'certNo'
            }

            certBtn.addEventListener('click', generateCertificate);
        });
    </script>
</body>
</html>
